<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <th:block th:replace="~{layout :: site-head}"></th:block>

</head>

<body>

    <div class="app">

        <aside th:replace="~{layout :: sidebar('usuarios')}"></aside>

        <div class="main-wrap">

            <header th:replace="~{layout :: topbar('Registrar nuevo usuario del sistema')}"></header>

            <main class="page-content">

                <div class="page-header-flex">

                    <div class="page-header-title">

                        <h2>
                            <i class="bi bi-person-plus-fill"></i>
                            Nuevo Usuario
                        </h2>

                        <p>
                            Registro de nuevos usuarios del sistema hospitalario
                        </p>

                    </div>

                </div>

                <div class="card">

                    <form th:action="@{/usuarios/guardar}"
                          method="post">

                        <div class="form-grid">

                            <div class="form-group">

                                <label for="nombre">
                                    Nombre Completo
                                </label>

                                <input id="nombre"
                                       name="nombre"
                                       type="text"
                                       class="form-control"
                                       placeholder="Ingrese el nombre completo"
                                       required>

                            </div>

                            <div class="form-group">

                                <label for="cedula">
                                    Cédula
                                </label>

                                <input id="cedula"
                                       name="cedula"
                                       type="text"
                                       class="form-control"
                                       placeholder="Ingrese la cédula"
                                       required>

                            </div>

                            <div class="form-group">

                                <label for="username">
                                    Usuario
                                </label>

                                <input id="username"
                                       name="username"
                                       type="text"
                                       class="form-control"
                                       placeholder="Ingrese el usuario"
                                       required>

                            </div>

                            <div class="form-group">

                                <label for="password">
                                    Contraseña
                                </label>

                                <input id="password"
                                       name="password"
                                       type="password"
                                       class="form-control"
                                       placeholder="Ingrese la contraseña"
                                       required>

                            </div>

                            <div class="form-group">

                                <label for="rol">
                                    Rol del Usuario
                                </label>

                                <select id="rol"
                                        name="rol"
                                        class="form-control"
                                        required>

                                    <option value="">
                                        Seleccione un rol
                                    </option>

                                    <option value="ADMINISTRADOR">
                                        Administrador
                                    </option>

                                    <option value="SUPERVISOR">
                                        Supervisor
                                    </option>

                                    <option value="USUARIO">
                                        Usuario
                                    </option>

                                </select>

                            </div>

                        </div>

                        <div class="btn-action-group"
                             style="margin-top: 24px;">

                            <button type="submit"
                                    class="btn btn-primary">

                                <i class="bi bi-save-fill"></i>
                                Guardar Usuario

                            </button>

                            <a th:href="@{/usuarios}"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-left"></i>
                                Volver

                            </a>

                        </div>

                    </form>

                </div>

            </main>

        </div>

    </div>

</body>
</html>
